server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # За traefik (TLS терминируется на прокси) nginx не знает про https и внешний порт.
    # Без этого его 301 на каталог (/pixels -> /pixels/) уходит на http://host:3000/...
    # с битой схемой/портом. Относительный редирект (Location: /pixels/) сохраняет
    # схему и хост запроса, поэтому ссылки без хвостового слэша тоже работают.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml font/woff2;

    # Хэшированные ассеты Astro (/_astro/...) неизменяемы — кэшируем максимально.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Preserve query parameters, including recruiter link tags, on old CV URLs.
    location ~ ^/(pixels|based|warhammer)/?$ {
        return 301 /frontend/$1/$is_args$args;
    }

    location /pdf/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # HTML, фавиконки, спрайт иконок — всегда ревалидируем.
    # nginx сам отдаёт ETag/Last-Modified, поэтому ревалидация дешёвая (304).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
